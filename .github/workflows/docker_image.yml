name: Docker Image

# Builds the production image (the Dockerfile's prod stage) and publishes it to the GitHub Container
# Registry, so a server runs `docker compose pull` instead of building. Each branch gets its own tag
# (slashes become dashes); master is also `latest`.
on:
    push:
        branches:
            - master
            - trio-planning
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Image name and tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
                      type=sha,format=short

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: prod
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
